<!--
  BEMONIX — landing page (index.html)
  =========================================
  Single-file static site: all CSS lives in the <style> block below, all
  behavior in the <script> block at the bottom of <body>. No build step,
  no framework — just GSAP (loaded from CDN) for animation.

  This page is hero-only: nav + a cube-rolls-into-logo video hero (plays
  once, freezes on the settled BEMONIX mark) + footer. Previously this was
  a 3D "corridor" carousel of drifting template screenshots — that version
  is archived, unlinked, at index-corridor-backup.html if it's ever needed
  back.

  Part of a multi-page site: index.html (this page) / showcase.html (full
  44-template work grid) / featured.html ("What We Build" hover reveal) /
  about.html / services.html / contact.html. All six share the same nav,
  footer, and 5-variable color system defined in :root below.

  COLOR SYSTEM — change the whole site's palette by editing ONLY the five
  CSS custom properties in :root below. Every other color in this file is
  either `var(--accent|bg|surface|muted|text)` or an `rgba()` restating
  one of those hex values with transparency (since CSS can't apply alpha
  to a var() color directly). If you change a hex below, search the file
  for its rgb() equivalent and update those rgba(...) values too, or the
  translucent overlays (nav blur, hero vignette, etc.) will drift out of
  sync with the solid colors. Keep this :root identical across all six
  pages if you change the palette.
    --accent : highlight color — active states, links, small headings
    --bg     : page background
    --surface: card/panel background, hairline borders
    --muted  : secondary/body text (kept as an rgba() so it reads at
               partial opacity against either --bg or --surface)
    --text   : primary text color
  Current values are sampled directly from the Bemonix logo file
  (../Screenshots/235793839.png): background #fff7e2, ink #4c102a.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEMONIX — Web Design Agency</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Inter:wght@200;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* See the file-header comment above for what each variable controls. */
:root{--accent:#761941;--bg:#fff7e2;--surface:#ffffff;--muted:rgba(76,16,42,.55);--text:#4c102a;--gold:#c9a227} /* --gold is deliberately NOT overridden by the dark sections' local --accent/--surface/etc. redefinitions (see featured.html/services.html/contact.html) — it's one constant hover/highlight color used the same way everywhere, light or dark background, unlike --accent which flips per section */
/* html/body locked to exactly one viewport tall (no scroll) — this page is
   the hero section + footer meant to fit entirely on screen, same as the
   other five pages. .hero below flexes to fill whatever's left after the
   footer's natural height. */
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;display:flex;flex-direction:column}

/* Fixed header. Frosted-glass background (blur) so it stays legible over
   whatever scrolls underneath it — swap the logo file via nav .logo img
   src in the HTML, not here. */
nav{position:fixed;top:0;width:100%;height:90px;padding:0 3rem;display:flex;justify-content:space-between;align-items:center;z-index:200;background:rgba(255,247,226,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,162,39,.35);border-image:linear-gradient(90deg,transparent,var(--gold),transparent) 1} /* height is fixed on purpose — the logo is taller than the bar and is allowed to overflow it (see nav .logo below) rather than stretching the bar to match */
nav .logo{display:block;height:74px;width:auto;flex-shrink:0;opacity:0} /* this page uses the cube-only mark (not the full wordmark lockup the other five pages use), whose glyph fills nearly its whole canvas — sized to sit inside the 90px nav bar rather than deliberately overflowing it like the wordmark does elsewhere, since at wordmark-height this glyph would overflow past the top of the viewport itself, not just the nav box. Starts hidden (opacity:0) — the nav slot stays blank until the hero video finishes playing, then fades in (see "HERO — nav logo reveal" in <script>); pre-hidden here rather than only via JS/GSAP so there's no flash-of-visible-logo before that script runs */
nav > ul{display:flex;align-items:center;gap:2.5rem;list-style:none;opacity:0} /* fades in alongside nav .logo — see that rule's comment and "HERO — nav logo reveal" in <script>, which now also drives this */
nav a{color:var(--text);text-decoration:none;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase}
nav .nav-cta{padding:.5rem 1.5rem;border:1px solid rgba(76,16,42,.3);font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;color:var(--text);transition:border-color .3s,color .3s}
nav .nav-cta:hover{background:var(--accent) repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 2px,transparent 2px 6px);border-color:var(--gold);color:var(--gold)}
/* "Work" nav dropdown — .nav-dropdown is given the nav's own 90px height so
   its hover area spans down to exactly where the menu appears (top:100%),
   with no gap a slow-moving cursor could fall through and drop the :hover. */
nav .nav-dropdown{position:relative;display:flex;align-items:center;height:90px}
nav .nav-dropdown > a::after{content:'';display:inline-block;margin-left:.4em;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-top:4px solid currentColor;vertical-align:middle;opacity:.6}
nav .nav-dropdown-menu{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(-6px);display:flex;flex-direction:column;gap:.15rem;min-width:170px;list-style:none;background:rgba(255,247,226,.97);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--surface);border-radius:.6rem;padding:.5rem;box-shadow:0 20px 45px rgba(0,0,0,.18);opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}
nav .nav-dropdown:hover .nav-dropdown-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
nav .nav-dropdown-menu a{display:block;padding:.65rem .9rem;border-radius:.35rem;white-space:nowrap}
nav .nav-dropdown-menu a:hover{background:rgba(201,162,39,.1);color:var(--gold)}

/* NAV — RESPONSIVE. Three tiers, from the widest down:
     >1150px       desktop — the rules above, untouched.
     901-1150px    "smaller monitors": same full inline layout, just
                   shrunk (tighter gaps/type/logo) — there's still room
                   for the whole menu, it's just tight.
     <=900px       tablets and phones: nav > ul collapses behind the
                   hamburger toggle below; .nav-cta stays visible next to
                   it since it's the primary action.
   The hamburger doesn't duplicate any markup — .nav-open (toggled on
   <nav> by the JS at the bottom of <body>) just re-shows/restyles the
   SAME <ul> as a full-width dropdown panel, and the "Work" submenu
   becomes permanently inline there instead of hover-triggered, since
   touch has no hover. .nav-actions wraps .nav-cta + the toggle together
   so they sit as one group on the right once <ul> stops taking up space
   in the middle — see the HTML. */
.nav-actions{display:flex;align-items:center;gap:1rem;opacity:0} /* fades in alongside nav .logo — see that rule's comment and "HERO — nav logo reveal" in <script>, which now also drives this */
.nav-toggle{display:none;flex-direction:column;justify-content:center;gap:5px;width:32px;height:32px;background:none;border:none;cursor:pointer;padding:0;flex-shrink:0}
.nav-toggle span{display:block;width:100%;height:2px;background:var(--text);transition:transform .3s,opacity .3s}
nav.nav-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg)}
nav.nav-open .nav-toggle span:nth-child(2){opacity:0}
nav.nav-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

@media(max-width:1150px) and (min-width:901px){
  nav{padding:0 1.75rem}
  nav .logo{height:64px}
  nav > ul{gap:1.5rem}
  nav a{font-size:.62rem}
  nav .nav-cta{padding:.4rem 1.1rem;font-size:.6rem}
}

@media(max-width:900px){
  nav{padding:0 1.5rem}
  nav .logo{height:58px}
  .nav-toggle{display:flex}
  nav > ul{display:none;position:absolute;top:90px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;background:rgba(255,247,226,.98);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,162,39,.35);border-image:linear-gradient(90deg,transparent,var(--gold),transparent) 1;padding:.5rem 1.5rem 1.5rem;box-shadow:0 20px 40px rgba(0,0,0,.15);max-height:calc(100vh - 90px);overflow-y:auto}
  nav.nav-open > ul{display:flex}
  nav > ul > li{width:100%}
  nav > ul > li > a{display:block;padding:.9rem 0;border-bottom:1px solid rgba(76,16,42,.08)}
  nav .nav-dropdown{height:auto;display:block;position:static}
  nav .nav-dropdown > a::after{display:none}
  nav .nav-dropdown-menu{position:static;opacity:1;visibility:visible;transform:none;box-shadow:none;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border:none;padding:0 0 .5rem 1rem;gap:0;min-width:0}
  nav .nav-dropdown-menu a{padding:.7rem 0;border-bottom:none;font-size:.65rem;color:var(--muted)}
  nav .nav-cta{padding:.45rem 1rem;font-size:.6rem}
}

/* MOBILE — this page is normally locked to exactly one screen with no
   scroll (see html,body above); on a short/narrow phone viewport that
   means either illegible tiny text or clipped content, so below this
   breakpoint the constraint is dropped entirely and the hero just
   becomes a normal, natural-height, scrollable section instead. */
@media(max-width:640px){
  html,body{height:auto;overflow:visible}
  .hero{flex:none;min-height:100vh;min-height:100dvh}
  .hero-content{height:auto;min-height:100vh;min-height:100dvh;padding:7rem 1.25rem 3rem}
  .hero-content h1{white-space:normal;font-size:clamp(1.7rem,8vw,2.6rem);line-height:1.2} /* white-space was nowrap on desktop — at phone widths the full headline can't fit on one line at any legible size, so it needs to be allowed to wrap here */
  .hero-cta{flex-wrap:wrap;justify-content:center}
  .hero-logo{width:clamp(260px,88vw,420px)}
}

/* HERO — cube-rolls-into-logo video, centered. Plays once (no loop) and
   freezes on its last frame, which is already the settled BEMONIX mark —
   so the page ends in the same static-logo state either way. */
.hero{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero-logo-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;pointer-events:none}
/* Video is 1280x720 but the cube+wordmark art only fills a centered 895x246 band —
   crop to that band's aspect ratio with object-fit:cover so it isn't tiny and letterboxed. */
.hero-logo{width:clamp(480px,60vw,920px);aspect-ratio:1280/420;object-fit:cover;object-position:center;opacity:1;-webkit-mask-image:radial-gradient(ellipse 65% 70% at center,#000 68%,transparent 92%);mask-image:radial-gradient(ellipse 65% 70% at center,#000 68%,transparent 92%)} /* mask fades the video's own (slightly darker, compression-shifted) cream background into the page's --bg at the edges, instead of showing a visible rectangle — kept tight (68%->92%) so only the corners feather, not the cube/wordmark art itself */
.hero-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center 55%,rgba(255,247,226,0) 60%,rgba(255,247,226,.22) 100%);z-index:2;pointer-events:none} /* vignette so the video doesn't fight with the hero text */
.hero-content{position:relative;z-index:3;text-align:center;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;padding:7rem 2rem .35rem} /* top padding must clear the fixed nav's own 90px height — re-check if you resize `nav`'s `height`, not the logo. bottom padding kept small on purpose so the tagline/CTA cluster sits low, clear of the video's more central vertical range instead of drifting up into it */
.hero-content h1{font-family:'Jost',sans-serif;font-weight:600;font-size:clamp(1.8rem,4.2vw,3.8rem);line-height:1;letter-spacing:.08em;white-space:nowrap;opacity:0} /* pre-hidden here (not just via gsap.from) so there's no flash-of-visible-content before the entrance script below runs */
.hero-content h1 .accent{color:var(--accent)}
.hero-content p{font-size:.9rem;color:rgba(76,16,42,.75);letter-spacing:.2em;text-transform:uppercase;font-weight:200;opacity:0}
.hero-bar{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);width:200px;margin:.8rem auto 0;transform:scaleX(0)}
.hero-cta{display:flex;gap:1.2rem;justify-content:center;margin-top:2rem}
.hero-cta a{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:.9rem 2rem;border-radius:2px;transition:all .3s;opacity:0}
.hero-cta .btn-primary{background:var(--accent) repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 2px,transparent 2px 6px);color:var(--bg);border:1px solid var(--accent)}
.hero-cta .btn-primary:hover{background:var(--accent) repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 2px,transparent 2px 6px);border-color:var(--gold);color:var(--gold)}
.hero-cta .btn-secondary{color:var(--text);border:1px solid rgba(76,16,42,.3)}
.hero-cta .btn-secondary:hover{background:var(--accent) repeating-linear-gradient(45deg,rgba(255,255,255,.1) 0 2px,transparent 2px 6px);border-color:var(--gold);color:var(--gold)}

footer{padding:1.2rem 3rem;border-top:1px solid rgba(201,162,39,.35);border-image:linear-gradient(90deg,transparent,var(--gold),transparent) 1;text-align:center;font-size:.6rem;color:var(--muted);letter-spacing:.2em;flex-shrink:0}

/* PAGE TRANSITION — a full-screen curtain that sweeps up to cover the
   viewport before an internal navigation actually happens (see "HERO —
   page transition" in <script>), instead of the browser's own harsh
   unstyled reload. Starts translateY(100%) (parked just below the
   viewport, invisible) since THIS page is the departure side of the
   transition — showcase.html's copy of this block starts at translateY(0)
   (already covering) since it's the arrival side; the two together read
   as one continuous curtain sweeping up and off the top of the screen.

   .pt-frame is a still PNG of the hero video's own last frame (settled
   cube + BEMONIX wordmark, extracted from Cube_rolls_and_transforms_*.mp4
   — see hero-video-lastframe.png) rather than the plain cube mark, so
   both the logo AND the name are centered in the curtain. It reuses the
   exact same crop (aspect-ratio 1280/420, object-fit:cover) and edge
   mask-image as .hero-logo below, since it's a still of that same video —
   the mask feathers the still's own flat cream background out to
   transparent at the edges, and the curtain's own background (#fbf2e0) is
   sampled directly from that same still's background, so the two match
   exactly and the still's edges disappear into the curtain with zero
   visible seam, leaving just the dark linework floating on the curtain.
   Kept opacity:0 until the cover sweep finishes, THEN faded in (see
   "HERO — page transition" script) — it shouldn't appear mid-sweep. */
.page-transition{position:fixed;inset:0;z-index:9999;background:#fbf2e0;display:flex;align-items:center;justify-content:center;pointer-events:none;transform:translateY(100%)} /* sampled from .pt-frame's own background (see hero-video-lastframe.png) so the still's edges — already feathered transparent by its mask-image — disappear into the curtain with zero visible seam */
.pt-frame{width:clamp(320px,42vw,560px);aspect-ratio:1280/420;object-fit:cover;object-position:center;opacity:0;-webkit-mask-image:radial-gradient(ellipse 65% 70% at center,#000 68%,transparent 92%);mask-image:radial-gradient(ellipse 65% 70% at center,#000 68%,transparent 92%)}
</style>
</head>
<body>
<div class="page-transition" id="pageTransition"><img class="pt-frame" src="../Screenshots/hero-video-lastframe.png" alt=""></div>

<nav>
  <a href="index.html"><img class="logo" src="../Screenshots/cube-logo-upscaled-transparent.png" alt="Bemonix"></a>
  <ul>
    <li class="nav-dropdown">
      <a href="showcase.html">Work</a>
      <ul class="nav-dropdown-menu">
        <li><a href="featured.html">Featured Work</a></li>
        <li><a href="showcase.html">Website Designs</a></li>
      </ul>
    </li>
    <li><a href="about.html">About</a></li>
    <li><a href="services.html">Services</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-actions">
    <a href="contact.html" class="nav-cta">Start a Project</a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<section class="hero">
  <div class="hero-logo-wrap">
    <video class="hero-logo" id="heroVideo" autoplay muted playsinline preload="auto">
      <source src="../Screenshots/Cube_rolls_and_transforms_logo_202608310130.mp4" type="video/mp4">
    </video>
  </div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1><span class="accent">Digital</span> Solutions<span class="accent"> Built to</span> Perform</h1>
    <div class="hero-bottom">
      <p>Everything you see here was built by me. Let’s bring your vision to life.</p>
      <div class="hero-bar"></div>
      <div class="hero-cta">
        <a href="contact.html" class="btn-primary">Start a Project</a>
        <a href="showcase.html" class="btn-secondary">View Our Work</a>
      </div>
    </div>
  </div>
</section>

<footer>© 2026 BEMONIX · HOUSTON, TX · REMOTE WORLDWIDE</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ── MOBILE NAV TOGGLE ────────────────────────────────────────────────────────
// Hamburger just toggles a class on <nav> — the CSS at max-width:900px reuses
// the SAME <ul> as the mobile dropdown panel, no duplicate markup involved.
(function initNavToggle() {
  const nav = document.querySelector('nav');
  const toggle = document.getElementById('navToggle');
  if (!nav || !toggle) return;
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('nav-open');
    toggle.setAttribute('aria-expanded', open);
  });
  nav.querySelectorAll('ul a').forEach(a => a.addEventListener('click', () => {
    nav.classList.remove('nav-open');
    toggle.setAttribute('aria-expanded', 'false');
  }));
})();

// ── HERO REVEAL — nav + headline/tagline/bar/CTA ───────────────────────────────
// Everything above the fold (nav .logo/ul/.nav-actions, plus .hero-content's
// h1/p/.hero-bar/.hero-cta a) starts hidden via plain CSS (opacity:0 /
// scaleX(0)) and stays that way until the "X" finishes writing in the hero
// video — the video plays essentially alone first, THEN the rest of the page
// fades in as one sequence, instead of racing in on its own page-load timer
// while the video is still mid-animation. NOT tied to the video's 'ended'
// event — the video (24fps, 111 frames / 4.63s total) holds on the
// fully-settled logo for ~2s before it actually ends, so waiting for 'ended'
// reads as a laggy pause after the wordmark is already done. Frame-by-frame
// inspection of the source video found the X's stroke finishes drawing on by
// frame 63 (63/24 = 2.625s) — XFINISHED_T below.
//
// fromTo (not from) for the hero-content tweens: gsap.from() alone would be
// wrong here — it reads the element's CURRENT style as its animation target,
// and since that current style is already the hidden CSS state, a .from()
// would just animate from hidden to hidden (invisible the whole time). fromTo
// pins the visible end state explicitly, independent of whatever the CSS
// starts at.
//
// "Grows from the line": .hero-bar draws in FIRST (scaleX 0->1), as the one
// anchor everything else emerges from — then .hero-content p (sits directly
// above the bar) and .hero-cta a (sits directly below it) unfurl outward
// from the bar together, each rising/falling out of the bar's position
// rather than sliding in from its own independent offset. h1 (farthest from
// the bar) follows right after, as if the ripple reached one step further.
(function initHeroReveal() {
  const video = document.getElementById('heroVideo');
  const logo = document.querySelector('nav .logo');
  const navLinks = document.querySelector('nav > ul');
  const navActions = document.querySelector('.nav-actions');
  if (!video || !logo) return;
  const XFINISHED_T = 2.625;
  let revealed = false;
  const reveal = () => {
    if (revealed) return;
    revealed = true;
    gsap.timeline()
      .to([logo, navLinks, navActions], {opacity:1, duration:.5, ease:'sine.out'})
      .fromTo('.hero-bar', {scaleX:0}, {scaleX:1, duration:.7, ease:'power2.out'}, '-=.1')
      .addLabel('lineDrawn')
      .fromTo('.hero-content p', {y:24, opacity:0}, {y:0, opacity:1, duration:.6, ease:'power2.out'}, 'lineDrawn-=.15')
      .fromTo('.hero-cta a', {y:-20, opacity:0}, {y:0, opacity:1, duration:.6, stagger:.1, ease:'power2.out'}, 'lineDrawn-=.15')
      .fromTo('.hero-content h1', {y:70, opacity:0}, {y:0, opacity:1, duration:.9, ease:'power3.out'}, 'lineDrawn+=.05');
  };
  // rAF polling, not 'timeupdate' — 'timeupdate' only fires a few times a
  // second, which is too coarse to catch XFINISHED_T right when it happens.
  const checkProgress = () => {
    if (revealed) return;
    if (video.currentTime >= XFINISHED_T) reveal();
    else requestAnimationFrame(checkProgress);
  };
  requestAnimationFrame(checkProgress);
  video.addEventListener('error', reveal, {once:true});
})();

// ── HERO — page transition (View Our Work → showcase.html) ────────────────────
// Instead of the browser's harsh unstyled reload, play the curtain
// (#pageTransition, see its CSS comment) sweeping up to fully cover the
// screen, THEN fade in .pt-frame (only once the cover is complete, so it
// never appears mid-sweep), hold briefly, THEN navigate. showcase.html's
// own copy of this overlay starts already covering with .pt-frame already
// visible (continuing that same held frame), and sweeps the rest of the
// way off the top on load — the two halves read as one continuous motion
// across the page boundary.
(function initHeroWorkTransition() {
  const link = document.querySelector('.hero-cta .btn-secondary');
  const overlay = document.getElementById('pageTransition');
  const frame = overlay ? overlay.querySelector('.pt-frame') : null;
  if (!link || !overlay) return;

  link.addEventListener('click', e => {
    // Let modified clicks (open in new tab, etc.) behave normally.
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    const dest = link.getAttribute('href');
    gsap.timeline({onComplete: () => { window.location.href = dest; }})
      .to(overlay, {y:'0%', duration:.6, ease:'power2.inOut'})
      .to(frame, {opacity:1, duration:.45, ease:'power1.out'})
      .to({}, {duration:.3}); // hold the settled frame on screen a beat before navigating
  });
})();
</script>
</body>
</html>
